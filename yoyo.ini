# Yoyo migrations configuration
# See https://ollycope.com/software/yoyo/latest/

[DEFAULT]
# Database connection string (can be overridden by DATABASE_URL env var)
database = postgresql://bot_user:bot_password@localhost:5432/systech_aidd

# Directory containing migration scripts
sources = migrations

# Migration file format
