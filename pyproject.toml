[project]
name = "systech-aidd-live"
version = "0.1.0"
description = "AI-powered Telegram chatbot with context management"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0",
    "openai",
    "python-dotenv",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.12",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "aiosqlite>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "DTZ", "PIE", "PT", "RET", "SIM", "ARG", "ERA", "RUF"]
ignore = [
    "RUF001",  # Ignore ambiguous unicode characters (we use Cyrillic text)
    "RUF002",  # Ignore ambiguous unicode in docstrings (Russian comments)
    "ANN001",  # Missing type annotation for function argument (test fixtures)
    "ANN401",  # Dynamically typed expressions (Any) - needed for test fixtures
    "ARG001",  # Unused function argument - common in test fixtures and FastAPI
    "B008",    # Function calls in argument defaults - FastAPI Query/Depends pattern
    "DTZ005",  # datetime.now() without timezone - mock data generator
    "F821",    # Undefined name in type hints (forward references)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
# Plugins for SQLAlchemy
plugins = ["sqlalchemy.ext.mypy.plugin"]

# Disable specific checks that are too strict for CI
[[tool.mypy.overrides]]
module = "src.repository"
disable_error_code = ["arg-type"]  # SQLAlchemy type expressions

[[tool.mypy.overrides]]
module = "src.context_manager"
disable_error_code = ["type-arg"]  # Generic async_sessionmaker

[[tool.mypy.overrides]]
module = "src.main"
disable_error_code = ["arg-type"]  # async_sessionmaker union types

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["type-arg", "unused-ignore"]  # Test fixtures

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
omit = ["tests/*", "**/__pycache__/*", "src/main.py"]

