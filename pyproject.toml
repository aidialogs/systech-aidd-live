[project]
name = "systech-aidd-live"
version = "0.1.0"
description = "AI-powered Telegram chatbot with context management"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

