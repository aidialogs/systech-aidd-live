[project]
name = "systech-aidd-live"
version = "0.1.0"
description = "AI-powered Telegram chatbot with context management"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0",
    "openai",
    "python-dotenv",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.12",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "aiosqlite>=0.19",
    "httpx>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "DTZ", "PIE", "PT", "RET", "SIM", "ARG", "ERA", "RUF"]
ignore = ["RUF001"]  # Ignore ambiguous unicode characters (we use Cyrillic text)

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
omit = ["tests/*", "**/__pycache__/*", "src/main.py"]

