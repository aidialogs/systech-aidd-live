name: Secrets Audit

on:
  pull_request:
    branches:
      - day06-smirnov-live-02-ci-pipeline
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  secrets-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Check PR for secrets and sensitive data
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: gpt-5
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cursor-agent -p "You are a security auditor in GitHub Actions. Analyze PR #${{ github.event.pull_request.number }} in repo ${{ github.repository }}. Task: (1) Get the PR diff using 'gh pr diff $PR_NUMBER', (2) Scan all changes for potential secrets: API keys, tokens, passwords, private keys, connection strings, AWS credentials, any hardcoded sensitive data, (3) Check for exposure of internal URLs, IPs, usernames, email addresses, (4) If ANY secrets or sensitive data found, EXIT with error code 1 and post a detailed comment to the PR listing all findings with file names and line numbers, (5) If no issues found, post a short approval comment. Use gh CLI for all operations." --force --model "$MODEL" --output-format=text