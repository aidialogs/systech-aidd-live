name: Secrets Audit

on:
  pull_request:
    branches:
      - day06-smirnov-live-02-ci-pipeline
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  secrets-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Configure git identity
        run: |
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"

      - name: Scan and propose hardening
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: gpt-5
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_PREFIX: audit
        run: |
          cursor-agent -p "You are in GitHub Actions runner with gh CLI and git access. Repo: ${{ github.repository }}, Branch prefix: ${{ env.BRANCH_PREFIX }}. Task: (1) Scan for secrets in files and history respecting .gitleaks.toml if present, (2) Detect risky workflow patterns: unpinned actions, overbroad permissions, unsafe pull_request_target, secrets in forked PRs, missing permissions, (3) Create or update persistent branch with prefix, (4) Propose minimal fixes: redact secrets, pin actions to SHA, reduce permissions, add SECURITY_LOG.md with summary, (5) Push to origin, (6) If open PRs exist, post or update a comment on the most recent PR with a brief explanation and compare link to create PR from the hardening branch. Use gh to list and comment on PRs, avoid duplicates." --force --model "$MODEL" --output-format=text