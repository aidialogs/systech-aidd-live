name: Build and Push Docker Images

on:
  # Проверка сборки при Pull Request (без публикации)
  pull_request:
    branches:
      - main
      - day6-ci-draft
      - day6-ci-test
  
  # Сборка и публикация при push в тестовую ветку
  push:
    branches:
      - day6-ci-draft
      - day6-ci-test

# Разрешения для публикации в GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        check:
          - name: python-tests
            run: uv run pytest tests/ -v -m "not integration"
          - name: python-lint
            run: uv run ruff check src/ tests/
          - name: python-types
            run: uv run mypy src/ tests/
          - name: frontend-lint
            run: cd frontend && pnpm lint
          - name: frontend-types
            run: cd frontend && pnpm type-check
          - name: frontend-format
            run: cd frontend && pnpm format:check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Python setup (only for python-* checks)
      - name: Set up Python
        if: startsWith(matrix.check.name, 'python-')
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        if: startsWith(matrix.check.name, 'python-')
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Add uv to PATH
        if: startsWith(matrix.check.name, 'python-')
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Cache uv dependencies
        if: startsWith(matrix.check.name, 'python-')
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Install Python dependencies
        if: startsWith(matrix.check.name, 'python-')
        run: uv sync --extra dev
      
      # Node.js setup (only for frontend-* checks)
      - name: Set up Node.js
        if: startsWith(matrix.check.name, 'frontend-')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        if: startsWith(matrix.check.name, 'frontend-')
        uses: pnpm/action-setup@v4
        with:
          version: 8
      
      - name: Cache pnpm store
        if: startsWith(matrix.check.name, 'frontend-')
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: Install frontend dependencies
        if: startsWith(matrix.check.name, 'frontend-')
        run: cd frontend && pnpm install
      
      # Run the check
      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}
      
      # Generate summary
      - name: Check summary
        if: always()
        run: |
          echo "### ✅ Quality Check: ${{ matrix.check.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "**Status:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Command:** \`${{ matrix.check.run }}\`" >> $GITHUB_STEP_SUMMARY

  build-and-push:
    needs: [test-and-lint]
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [bot, api, frontend]
        include:
          # Контекст и Dockerfile для каждого сервиса
          - service: bot
            context: .
            dockerfile: devops/Dockerfile.bot
          - service: api
            context: .
            dockerfile: devops/Dockerfile.api
          - service: frontend
            context: frontend
            dockerfile: ../devops/Dockerfile.frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Login только при push (не для PR)
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Извлечение метаданных для тегов и labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            # latest для push в day6-ci-draft
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/day6-ci-draft' }}
            # Короткий SHA коммита
            type=sha,prefix=sha-,format=short
      
      # Build и Push образа
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          # Push только при push event (не для PR)
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэширование Docker layers для ускорения сборки
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      
      - name: Image build summary
        run: |
          echo "### 🐳 Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pushed:** ${{ github.event_name == 'push' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "**Image:** \`ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "**SHA tag:** \`ghcr.io/${{ github.repository }}/${{ matrix.service }}:sha-${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "*Image built successfully but not pushed (PR check only)*" >> $GITHUB_STEP_SUMMARY
          fi

