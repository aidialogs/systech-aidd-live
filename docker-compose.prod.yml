version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: systech-aidd-postgres
    environment:
      POSTGRES_USER: systech_user
      POSTGRES_PASSWORD: systech_password
      POSTGRES_DB: systech_aidd
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systech_user -d systech_aidd"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    image: ghcr.io/aidialogs/systech-aidd-bot:latest
    container_name: systech-aidd-bot
    command: ["uv", "run", "python", "-m", "src.main"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/aidialogs/systech-aidd-api:latest
    container_name: systech-aidd-api
    command: ["uv", "run", "python", "-m", "src.api_server"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/aidialogs/systech-aidd-frontend:latest
    container_name: systech-aidd-frontend
    command: ["pnpm", "dev"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

