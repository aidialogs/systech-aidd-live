version: '3.8'

# Development overrides для локальной разработки с hot reload
# Использование: docker compose -f devops/docker-compose.yml -f devops/docker-compose.dev.yml up

services:
  # Bot в dev режиме с volume mounts
  bot:
    environment:
      DATABASE_ECHO: "true"
      LOG_LEVEL: DEBUG
    volumes:
      - ../src:/app/src:ro
      - ../prompts:/app/prompts:ro
      - ../logs:/app/logs
    command: ["python", "-m", "src.main"]

  # API в dev режиме с volume mounts и reload
  api:
    environment:
      DATABASE_ECHO: "true"
      LOG_LEVEL: DEBUG
    volumes:
      - ../src:/app/src:ro
      - ../prompts:/app/prompts:ro
      - ../logs:/app/logs
    # Uvicorn с auto-reload для разработки
    command: >
      uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
    ports:
      - "8000:8000"
      - "5678:5678"  # Порт для отладки (debugpy)

  # Frontend в dev режиме с volume mounts
  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/Dockerfile.frontend
      target: deps  # Используем только deps stage для dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../frontend:/app:cached
      - /app/node_modules
      - /app/.next
    # Dev server Next.js
    command: ["sh", "-c", "pnpm install && pnpm dev"]
    ports:
      - "3000:3000"

  # PostgreSQL с дополнительными настройками для dev
  postgres:
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"

