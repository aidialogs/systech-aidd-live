# Пример файла docker-compose.override.yml для локальных переопределений
# 
# Docker Compose автоматически применяет override файл если он существует.
# Используйте его для переключения между локальной сборкой и образами из registry.
#
# Скопируйте этот файл в docker-compose.override.yml и раскомментируйте нужную секцию:
# cp docker-compose.override.example.yml docker-compose.override.yml

services:
  # ====================================================================
  # ВАРИАНТ 1: Использовать образы из GitHub Container Registry
  # ====================================================================
  # Раскомментируйте эту секцию чтобы использовать предсобранные образы
  
  # bot:
  #   image: ghcr.io/akozhin/systech-aidd-live/bot:latest
  #   build: null  # Отключить локальную сборку
  
  # api:
  #   image: ghcr.io/akozhin/systech-aidd-live/api:latest
  #   build: null
  
  # frontend:
  #   image: ghcr.io/akozhin/systech-aidd-live/frontend:latest
  #   build: null

  # ====================================================================
  # ВАРИАНТ 2: Локальная сборка (поведение по умолчанию)
  # ====================================================================
  # Ничего не нужно делать - docker-compose.yml уже настроен на локальную сборку
  
  # ====================================================================
  # ВАРИАНТ 3: Использовать конкретный тег (например, SHA)
  # ====================================================================
  # Полезно для тестирования конкретной версии
  
  # bot:
  #   image: ghcr.io/akozhin/systech-aidd-live/bot:sha-abc1234
  #   build: null
  
  # api:
  #   image: ghcr.io/akozhin/systech-aidd-live/api:sha-abc1234
  #   build: null
  
  # frontend:
  #   image: ghcr.io/akozhin/systech-aidd-live/frontend:sha-abc1234
  #   build: null

  # ====================================================================
  # ДОПОЛНИТЕЛЬНЫЕ ПЕРЕОПРЕДЕЛЕНИЯ
  # ====================================================================
  # Здесь можно переопределить любые параметры сервисов
  # Например, изменить порты, volumes, environment variables
  
  # postgres:
  #   ports:
  #     - "5433:5432"  # Использовать другой порт
  
  # api:
  #   environment:
  #     - DEBUG=true

