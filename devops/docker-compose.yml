services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: systech-aidd-postgres
    environment:
      POSTGRES_USER: systech_user
      POSTGRES_PASSWORD: systech_password
      POSTGRES_DB: systech_aidd
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systech_user -d systech_aidd"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - systech-network

  # Telegram Bot Service
  bot:
    build:
      context: ..
      dockerfile: devops/Dockerfile.bot
    container_name: systech-aidd-bot
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://systech_user:systech_password@postgres:5432/systech_aidd
      SYSTEM_PROMPT_FILE: /app/prompts/system_prompt.txt
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot_logs:/app/logs
    restart: unless-stopped
    networks:
      - systech-network

  # FastAPI Service
  api:
    build:
      context: ..
      dockerfile: devops/Dockerfile.api
    container_name: systech-aidd-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://systech_user:systech_password@postgres:5432/systech_aidd
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped
    networks:
      - systech-network

  # Next.js Frontend Service
  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/Dockerfile.frontend
    container_name: systech-aidd-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - systech-network

volumes:
  postgres_data:
    driver: local
  bot_logs:
    driver: local
  api_logs:
    driver: local

networks:
  systech-network:
    driver: bridge

